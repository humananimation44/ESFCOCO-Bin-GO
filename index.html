<html>
    <head>
        <title>My Flask App</title>
        <style>
            body {
                max-width: 900px;
                margin: 32px auto;
                padding: 0 20px;
                color: #202620;
                font: 16px/1.5 system-ui, sans-serif;
            }
            button {
                margin-right: 8px;
                padding: 8px 14px;
                font: inherit;
                cursor: pointer;
            }
            input {
                margin-right: 8px;
                padding: 8px 14px;
                font: inherit;
                cursor: pointer;
            }
            label {
                margin-right: 8px;
                padding: 8px 14px;
                font: inherit;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <center>
        <h1>Prototype BIN-GO</h1>
        <form class= "grid" action="/result" method="post">
            {% if user != "not logged in" %}
                <p>Welcome {{ user }}, Your score is: {{ score }}!</p>
                <button type="button" onclick="window.location.href='/demo'">Demo</button>
                <button type="button" onclick="window.location.href='/rewards'">Rewards</button>
                <a href="/logout">Log Out</a>
            {% else %}
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
                <input type="submit" value="Log In/Sign Up" onclick="window.location.href='/result'">
            {% endif %}
        </form>
        </center>
    </body>
</html>
